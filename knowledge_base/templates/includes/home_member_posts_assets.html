<script>
(() => {
    function initialize() {
        const root = document.getElementById('home-member-posts');
        const source = document.getElementById('home-member-post-data');
        if (!root || !source || root.dataset.initialized) return;
        root.dataset.initialized = 'true';
        const periods = JSON.parse(source.textContent);
        const canvas = root.querySelector('canvas');
        const wrapper = root.querySelector('[data-home-post-chart]');
        const details = root.querySelector('[data-home-post-details]');
        const buttons = root.querySelectorAll('[data-home-post-period]');
        const labels = {all: '全期間', current: '当月', previous: '前月'};
        let selectedPeriod = 'all', selectedSort = 'no';
        const datasetVisible = [true, true];
        let chart = null;
        const totalsPlugin = {
            id: 'homePostTotals',
            afterDatasetsDraw(chart) {
                const {ctx, data} = chart;
                ctx.save();
                ctx.fillStyle = '#374151';
                ctx.font = '600 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                const visibleIndices = data.datasets.map((_, index) => index).filter(index => datasetVisible[index]);
                data.labels.forEach((_, index) => {
                    const bars = visibleIndices.map(datasetIndex => chart.getDatasetMeta(datasetIndex).data[index]).filter(Boolean);
                    const bar = bars.reduce((top, item) => !top || item.y < top.y ? item : top, null);
                    const total = visibleIndices.reduce((sum, datasetIndex) => sum + data.datasets[datasetIndex].data[index], 0);
                    if (bar) ctx.fillText(String(total), bar.x, bar.y - 4);
                });
                ctx.restore();
            },
        };
        function selectPeriod(period) {
            const data = periods[period];
            if (!data) return;
            selectedPeriod = period;
            const rows = [...data.rows];
            if (selectedSort === 'post_count') rows.sort((a, b) => b.post_count_total - a.post_count_total);
            buttons.forEach(button => {
                const active = button.dataset.homePostPeriod === period;
                button.classList.toggle('active', active);
                button.classList.toggle('btn-primary', active);
                button.classList.toggle('btn-outline-primary', !active);
                button.setAttribute('aria-pressed', String(active));
            });
            root.querySelectorAll('[data-home-post-table]').forEach(table => {
                table.hidden = table.dataset.homePostTable !== period;
            });
            root.querySelector('#home-post-status').textContent =
                `${labels[period]}：合計 ${data.totals.post_count_total} 件`;
            const target = data.target_chart || {};
            const targetStatus = root.querySelector('#home-post-target');
            if (targetStatus) targetStatus.textContent = typeof target.value === 'number'
                ? `赤線：${target.label} ${target.value} 件（アナライズと同じ目標）`
                : '投稿目標は未設定です。';
            canvas.setAttribute('aria-label', `${labels[period]}のメンバー別Q&A・Tips投稿数（積み上げ棒グラフ）`);
            if (typeof window.Chart !== 'function' || !data.rows.length) return;
            const chartData = {
                labels: rows.map(row => row.name),
                datasets: [
                    {label: 'Q&A', data: rows.map(row => row.faq_post_count),
                     hidden: !datasetVisible[0],
                     backgroundColor: 'rgba(220, 53, 69, 0.82)', borderRadius: 8, maxBarThickness: 42, stack: 'postStack'},
                    {label: 'Tips', data: rows.map(row => row.tips_post_count),
                     hidden: !datasetVisible[1],
                     backgroundColor: 'rgba(73, 136, 232, 0.82)', borderRadius: 8, maxBarThickness: 42, stack: 'postStack'},
                ],
            };
            const maximum = Math.max(0, ...rows.map(row =>
                (datasetVisible[0] ? row.faq_post_count : 0) + (datasetVisible[1] ? row.tips_post_count : 0)));
            const targetChart = window.summaryTargetChart?.(target, maximum);
            const suggestedMax = targetChart?.suggestedMax || (maximum ? Math.ceil(maximum * 1.3) : 5);
            try {
                if (chart) {
                    chart.data = chartData;
                    chart.config.plugins = targetChart ? [totalsPlugin, targetChart.plugin] : [totalsPlugin];
                    chart.options.scales.y.suggestedMax = suggestedMax;
                    chart.update();
                } else {
                    wrapper.hidden = false;
                    wrapper.firstElementChild.style.minWidth = `${Math.max(280, data.rows.length * 64)}px`;
                    chart = new window.Chart(canvas, {
                        type: 'bar', data: chartData, plugins: targetChart ? [totalsPlugin, targetChart.plugin] : [totalsPlugin],
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            layout: {padding: {top: 15}},
                            plugins: {
                                legend: {display: false},
                                tooltip: {callbacks: {footer(items) {
                                    return `合計: ${items.reduce((sum, item) => sum + item.parsed.y, 0)}`;
                                }}},
                            },
                            scales: {
                                x: {stacked: true, ticks: {autoSkip: false}},
                                y: {stacked: true, beginAtZero: true, suggestedMax, ticks: {precision: 0}},
                            },
                        },
                    });
                    details.open = false;
                    details.hidden = true;
                }
            } catch (error) {
                if (chart) chart.destroy();
                else window.Chart.getChart?.(canvas)?.destroy();
                chart = null;
                wrapper.hidden = true;
                details.open = true;
                details.hidden = false;
            }
        }
        buttons.forEach(button => button.addEventListener('click', () => selectPeriod(button.dataset.homePostPeriod)));
        root.querySelectorAll('[data-home-post-dataset]').forEach(button => button.addEventListener('click', () => {
            if (!chart) return;
            const index = Number(button.dataset.homePostDataset);
            datasetVisible[index] = !datasetVisible[index];
            button.setAttribute('aria-pressed', String(datasetVisible[index]));
            selectPeriod(selectedPeriod);
        }));
        root.querySelectorAll('[data-home-post-sort]').forEach(button => button.addEventListener('click', () => {
            selectedSort = button.dataset.homePostSort;
            root.querySelectorAll('[data-home-post-sort]').forEach(item => {
                const active = item.dataset.homePostSort === selectedSort;
                item.classList.toggle('active', active);
                item.setAttribute('aria-pressed', String(active));
            });
            selectPeriod(selectedPeriod);
        }));
        selectPeriod('all');
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initialize, {once: true});
    else initialize();
})();
</script>
