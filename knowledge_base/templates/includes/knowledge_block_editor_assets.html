<style>
.knowledge-block-editor { display: grid; gap: 1rem; margin-block: .5rem 1rem; }
.knowledge-block-card { border: 1px solid #e8d9cb; border-radius: .65rem; background: #fff; overflow: hidden; }
.knowledge-block-header { background: #fff3e5; border-bottom: 1px solid #efdbc5; padding: .8rem 1rem; }
.knowledge-block-heading { width: 100%; box-sizing: border-box; border: 1px solid #c9b8a6; border-radius: .3rem; padding: .5rem; }
.knowledge-block-heading-shortcuts { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .5rem; }
.knowledge-block-heading-shortcuts > button { border: 1px solid #bca58b; border-radius: .35rem; padding: .3rem .7rem; background: #fffaf4; color: #633d19; cursor: pointer; }
.knowledge-block-heading-shortcuts > button:hover { background: #f5e1c9; }
.knowledge-block-body { padding: 1rem; }
.knowledge-block-body textarea { width: 100%; height: 300px; min-height: 160px; resize: vertical; box-sizing: border-box; }
.knowledge-block-card:not(.knowledge-editor-ready) .knowledge-block-body textarea { display: block !important; visibility: visible !important; }
.knowledge-block-card:not(.knowledge-editor-ready) .tox-tinymce { display: none !important; }
.knowledge-block-error { color: #b42318; margin: 0; }
.knowledge-block-editor label { display: block; font-weight: 600; margin-bottom: .35rem; }
.knowledge-block-actions { display: flex; flex-wrap: wrap; gap: .5rem; padding: 0 1rem .8rem; }
.knowledge-block-editor > button, .knowledge-block-actions > button { border: 1px solid #bca58b; border-radius: .35rem; padding: .4rem .8rem; background: #fffaf4; color: #633d19; cursor: pointer; }
.knowledge-block-actions > button:disabled { opacity: .45; cursor: default; }
.knowledge-block-editor :focus-visible { outline: 3px solid #ad621b; outline-offset: 2px; }
.knowledge-block-editor .knowledge-block-hint { display: block; color: #655b50; font-size: .85rem; margin-bottom: .4rem; }
.knowledge-block-editor p, .knowledge-block-editor h3 { text-indent: 0; }
</style>
<script>
(() => {
    'use strict';
    if (window.KnowledgeBlockEditors) return;
    const records = new Map(), owners = new Map();
    let serial = 0;
    const headingText = value => String(value).replace(/[\s\u200b\ufeff]/g, '');
    const escape = value => {
        const node = document.createElement('div');
        node.textContent = String(value);
        return node.innerHTML;
    };
    const isHtml = value => /<\/?[a-z][^>]*>/i.test(value);
    const editableHtml = value => isHtml(value) ? value : '<p>' + escape(value)
        .replace(/\r\n?/g, '\n').replace(/\n/g, '<br>')
        .replace(/\[b\]([\s\S]*?)\[\/b\]/gi, '<strong>$1</strong>')
        .replace(/\[i\]([\s\S]*?)\[\/i\]/gi, '<em>$1</em>')
        .replace(/\[u\]([\s\S]*?)\[\/u\]/gi, '<u>$1</u>')
        .replace(/\[s\]([\s\S]*?)\[\/s\]/gi, '<s>$1</s>')
        .replace(/\[size=(8|10|12|14|16|18|20)\]([\s\S]*?)\[\/size\]/gi, '<span style="font-size:$1pt">$2</span>')
        .replace(/\[color=(#[0-9a-f]{3}|#[0-9a-f]{6}|[a-z]{3,20})\]([\s\S]*?)\[\/color\]/gi, '<span style="color:$1">$2</span>') + '</p>';
    const fragment = html => {
        const template = document.createElement('template');
        template.innerHTML = html;
        return template.content;
    };
    // Keep source slices rather than reserializing DOM: untouched markup is byte-for-byte stable.
    function slices(html) {
        const tags = /<!--[\s\S]*?-->|<![^>]*>|<\/?[a-z][a-z0-9:-]*(?:\s+(?:[^'">]|"[^"]*"|'[^']*')*)?\s*\/?>/gi;
        const voids = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
        let depth = 0, start = 0, match, raw = null;
        const result = [];
        while ((match = tags.exec(html))) {
            const token = match[0], name = /^<\/?([a-z0-9:-]+)/i.exec(token)?.[1]?.toLowerCase();
            if (raw && token.toLowerCase() !== '</' + raw + '>') continue;
            if (!name) continue;
            const close = token.startsWith('</');
            if (!depth && match.index > start) result.push(html.slice(start, match.index));
            if (!depth) start = match.index;
            if (close) { depth = Math.max(0, depth - 1); raw = null; }
            else if (!voids.test(name) && !token.endsWith('/>')) {
                depth++;
                if (/^(script|style|textarea|title)$/.test(name)) raw = name;
            }
            if (!depth) { result.push(html.slice(start, tags.lastIndex)); start = tags.lastIndex; }
        }
        if (start < html.length) result.push(html.slice(start));
        return result;
    }
    function parse(html) {
        const parts = slices(html), parsed = [];
        let found = false;
        for (const raw of parts) {
            const node = fragment(raw).firstChild;
            if (node?.nodeType === 1 && node.tagName === 'DIV' &&
                    node.getAttribute('class') === 'knowledge-content-section') {
                const inside = raw.replace(/^<div\b(?:[^'">]|"[^"]*"|'[^']*')*>/i, '').replace(/<\/div>\s*$/i, '');
                const children = slices(inside).filter(part => part.trim());
                let heading = '', body = null, valid = true;
                children.forEach((part, index) => {
                    const child = fragment(part).firstChild;
                    if (index === 0 && child?.nodeType === 1 && child.tagName === 'H3') heading = child.textContent;
                    else if (body === null && child?.nodeType === 1 && child.tagName === 'DIV' &&
                            child.getAttribute('class') === 'knowledge-section-body') {
                        body = part.replace(/^<div\b(?:[^'">]|"[^"]*"|'[^']*')*>/i, '').replace(/<\/div>\s*$/i, '');
                    } else valid = false;
                });
                if (valid && body !== null) {
                    parsed.push({raw, heading, body, wrapped: true}); found = true; continue;
                }
            }
            if (parsed.length && !parsed.at(-1).wrapped) {
                parsed.at(-1).raw += raw; parsed.at(-1).body += raw;
            } else parsed.push({raw, heading: '', body: raw, wrapped: false});
        }
        return found ? parsed : [{raw: html, heading: '', body: html, wrapped: false}];
    }
    function meaningful(html) {
        const dom = fragment(html);
        dom.querySelectorAll('script,style').forEach(node => node.remove());
        return Boolean(dom.textContent.replace(/[\s\u200b\ufeff]/g, '') || dom.querySelector('img,video,audio,iframe,object,embed,hr,table'));
    }
    // Textarea fallback edits HTML source, never executes it. Sanitize only edited content.
    function safeFallback(html) {
        const dom = fragment(html);
        dom.querySelectorAll('script,style,iframe,object,embed,link,meta,base,form,input,button,textarea,svg,math').forEach(n => n.remove());
        dom.querySelectorAll('*').forEach(node => Array.from(node.attributes).forEach(attr => {
            if (attr.name.toLowerCase() === 'style') {
                const safe = document.createElement('span');
                for (const property of ['color', 'background-color']) {
                    const value = node.style.getPropertyValue(property).trim();
                    // CSS variables, inheritance and URL/function payloads are not colors.
                    if (value && !/var\(|url\(|expression\(|inherit|initial|unset|revert|currentcolor/i.test(value) &&
                            CSS.supports(property, value)) safe.style.setProperty(property, value);
                }
                if (safe.style.length) node.setAttribute('style', safe.getAttribute('style'));
                else node.removeAttribute('style');
            } else if (/^on/i.test(attr.name) || /^srcdoc$/i.test(attr.name) ||
                (/^(href|src|xlink:href)$/i.test(attr.name) && !/^(https?:|mailto:|tel:|\/|#|[^:\s]+(?:\/|$))/i.test(attr.value.trim()))) node.removeAttribute(attr.name);
        }));
        const container = document.createElement('div'); container.append(dom);
        return container.innerHTML;
    }
    // Metadata is editor-only: saved commands contain no controls, events or private attributes.
    const commandOrigins = new WeakMap();
    function toggleCommand(editor) {
        const body = editor.getBody?.(), selection = editor.selection?.getRng?.();
        if (!body || !selection || !body.contains(selection.startContainer) || !body.contains(selection.endContainer)) return;
        const doc = body.ownerDocument;
        const isBlock = node => node.nodeType === 1 && /^(P|DIV|H[1-6]|LI|UL|OL|BLOCKQUOTE|PRE|TABLE|THEAD|TBODY|TFOOT|TR|TD|TH|HR|SECTION|ARTICLE|ASIDE|MAIN|HEADER|FOOTER|NAV|DL|DT|DD|ADDRESS|FIGURE|FIGCAPTION|DETAILS|SUMMARY)$/.test(node.tagName);
        const groups = [], commands = [];
        const overlaps = range => {
            if (selection.collapsed) return range.comparePoint(selection.startContainer, selection.startOffset) === 0;
            const start = selection.cloneRange(), end = selection.cloneRange();
            start.collapse(true); end.collapse(false);
            const lineStart = range.cloneRange(), lineEnd = range.cloneRange();
            lineStart.collapse(true); lineEnd.collapse(false);
            if (end.compareBoundaryPoints(0, lineStart) <= 0 || start.compareBoundaryPoints(0, lineEnd) >= 0) return false;
            // Element/text boundaries can differ in DOM order while selecting zero characters.
            const intersection = range.cloneRange();
            if (start.compareBoundaryPoints(0, lineStart) > 0) intersection.setStart(selection.startContainer, selection.startOffset);
            if (end.compareBoundaryPoints(0, lineEnd) < 0) intersection.setEnd(selection.endContainer, selection.endOffset);
            return Boolean(intersection.toString().length);
        };
        function scan(container) {
            if (container.matches?.('div.knowledge-command')) {
                const range = doc.createRange(); range.selectNodeContents(container);
                if (overlaps(range)) commands.push(container);
                return;
            }
            let start = 0;
            const children = [...container.childNodes];
            function flow(end) {
                if (start === end) return;
                const whole = doc.createRange(); whole.setStart(container, start); whole.setEnd(container, end);
                const breaks = [];
                function find(node) {
                    if (node.nodeName === 'BR' && !node.hasAttribute('data-mce-bogus')) breaks.push(node);
                    else node.childNodes.forEach(find);
                }
                children.slice(start, end).forEach(find);
                let point = [container, start];
                const lines = breaks.map(br => {
                    const range = doc.createRange(); range.setStart(...point); range.setEndBefore(br);
                    point = [br.parentNode, [...br.parentNode.childNodes].indexOf(br) + 1];
                    return range;
                });
                const last = doc.createRange(); last.setStart(...point); last.setEnd(container, end); lines.push(last);
                const selected = lines.map(range => overlaps(range) && Boolean(range.toString().length));
                if (selected.some(Boolean)) groups.push({container, whole, lines, selected});
            }
            children.forEach((child, index) => {
                if (!isBlock(child)) return;
                flow(index); scan(child); start = index + 1;
            });
            flow(children.length);
        }
        scan(body);
        if (!groups.length && !commands.length) return;
        const mutate = () => {
            let caret = null;
            // Existing command lines toggle back to editable text with their inline styles intact.
            commands.forEach(command => {
                const original = commandOrigins.get(command);
                const restored = original ? original.cloneNode(false) : doc.createElement('p');
                const code = command.querySelector(':scope > code');
                while ((code || command).firstChild) restored.append((code || command).firstChild);
                command.replaceWith(restored); caret = restored;
            });
            groups.reverse().forEach(({container, whole, lines, selected}) => {
                const output = doc.createDocumentFragment();
                const splitParagraph = /^(P|H[1-6]|PRE)$/.test(container.nodeName);
                let plain = null;
                lines.forEach((range, index) => {
                    const content = range.cloneContents();
                    if (selected[index]) {
                        plain = null;
                        const command = doc.createElement('div'), code = doc.createElement('code');
                        command.className = 'knowledge-command';
                        // Retain inherited paragraph color/formatting without putting a block inside code.
                        if (splitParagraph && container.hasAttribute('style')) {
                            const span = doc.createElement('span'); span.setAttribute('style', container.getAttribute('style'));
                            span.append(content); code.append(span);
                        } else code.append(content);
                        command.append(code); output.append(command);
                        commandOrigins.set(command, splitParagraph ? container.cloneNode(false) : doc.createElement('p'));
                        caret = command;
                    } else {
                        if (splitParagraph) {
                            if (!plain) { plain = container.cloneNode(false); output.append(plain); }
                            else plain.append(doc.createElement('br'));
                            plain.append(content);
                        } else {
                            if (index && !selected[index - 1]) output.append(doc.createElement('br'));
                            output.append(content);
                        }
                    }
                });
                if (splitParagraph) container.replaceWith(output);
                else { whole.deleteContents(); whole.insertNode(output); }
            });
            if (caret) { editor.selection.select(caret, true); editor.selection.collapse(true); }
        };
        if (editor.undoManager?.transact) editor.undoManager.transact(mutate); else mutate();
        editor.setDirty(true);
        // Explicit input covers DOM edits; change also updates integrations listening to TinyMCE.
        const dispatch = editor.dispatch || editor.fire;
        dispatch?.call(editor, 'input'); dispatch?.call(editor, 'change');
        editor.nodeChanged?.();
    }
    const state = (record, focused) => record.source.dispatchEvent(new CustomEvent('knowledge-editor-state', {
        bubbles: true, detail: {id: record.source.id, focused}
    }));
    function html(record) {
        if (!record.changed) return record.original;
        return record.blocks.map(block => {
            if (!block.headingChanged && !block.bodyChanged && block.raw !== null) return block.raw;
            return "<div class='knowledge-content-section'>" + (block.heading.value ? '<h3>' + escape(block.heading.value) + '</h3>' : '') +
                "<div class='knowledge-section-body'>" + (block.bodyChanged || block.wrapped ? block.body : editableHtml(block.body)) + '</div></div>';
        }).join('');
    }
    function sync(record) {
        if (!record) return '';
        record.blocks.forEach(block => block.read?.());
        const value = html(record);
        if (record.source.value !== value) {
            record.source.value = value;
            record.source.dispatchEvent(new Event('input', {bubbles: true}));
        }
        return value;
    }
    function changed(record) {
        record.changed = true;
        if (record.error) record.error.hidden = true;
        sync(record); state(record, record.root.contains(document.activeElement));
    }
    function buttons(record) {
        record.blocks.forEach((block, index) => {
            block.up.disabled = index === 0; block.down.disabled = index === record.blocks.length - 1;
            block.remove.disabled = record.blocks.length === 1;
            block.card.setAttribute('aria-label', 'セクション ' + (index + 1));
        });
    }
    function focusBlock(record, block) {
        record.active = block;
        if (block.editor) block.editor.focus(); else block.input.focus();
    }
    function add(record, data = {raw: null, heading: '', body: '', wrapped: true}) {
        const uid = 'knowledge-block-' + (++serial);
        const card = document.createElement('section'); card.className = 'knowledge-block-card';
        card.innerHTML = '<div class="knowledge-block-header"><label for="' + uid + '-heading">見出し <span aria-hidden="true">*</span></label>' +
            '<input class="knowledge-block-heading" id="' + uid + '-heading" placeholder="概要・手順など" type="text" aria-required="true"></div>' +
            '<div class="knowledge-block-body"><label for="' + uid + '">本文</label>' +
            '<small class="knowledge-block-hint" id="' + uid + '-hint">書式エディターが利用できない場合はHTML形式で編集できます。</small>' +
            '<textarea id="' + uid + '" aria-describedby="' + uid + '-hint"></textarea></div>' +
            '<div class="knowledge-block-actions"><button type="button" data-action="up" aria-label="このセクションを上へ移動">上へ</button>' +
            '<button type="button" data-action="down" aria-label="このセクションを下へ移動">下へ</button>' +
            '<button type="button" data-action="remove" aria-label="このセクションを削除">削除</button></div>';
        const block = {...data, card, heading: card.querySelector('input'), input: card.querySelector('textarea'), editor: null,
            headingChanged: false, bodyChanged: false, bookmark: null, ready: false, expired: false};
        // A suggested heading makes subsequent legacy edits valid, but never
        // marks the original HTML/plaintext/BBCode as edited or rewrites it.
        block.heading.value = !data.wrapped && data.body
            ? ({question: '質問', answer: '回答', body: '内容'}[record.source.name] || '内容') : data.heading;
        block.input.value = editableHtml(data.body);
        ['up', 'down', 'remove'].forEach(action => { block[action] = card.querySelector('[data-action="' + action + '"]'); });
        owners.set(block.input.id, record.source.id);
        record.blocks.push(block); record.list.append(card); buttons(record);
        card.addEventListener('focusin', () => { record.active = block; state(record, true); });
        card.addEventListener('focusout', () => setTimeout(() => state(record, record.root.contains(document.activeElement) || Boolean(block.editor?.hasFocus?.())), 0));
        block.heading.addEventListener('input', () => {
            block.heading.removeAttribute('aria-invalid');
            block.headingChanged = true; changed(record);
        });
        const presets = {question: ['質問'], answer: ['概要', '手順', '注意事項', '備考'], body: ['概要', '手順', '注意事項', '備考']}[record.source.name];
        if (presets) {
            const shortcuts = document.createElement('div');
            shortcuts.className = 'knowledge-block-heading-shortcuts';
            shortcuts.setAttribute('role', 'group');
            shortcuts.setAttribute('aria-label', '見出しのショートカット');
            presets.forEach(text => {
                const button = document.createElement('button');
                button.type = 'button'; button.textContent = text;
                button.setAttribute('aria-label', '見出しに「' + text + '」を入力');
                button.addEventListener('click', () => {
                    block.heading.value = text;
                    block.heading.dispatchEvent(new Event('input', {bubbles: true}));
                    block.heading.focus();
                });
                shortcuts.append(button);
            });
            block.heading.after(shortcuts);
        }
        block.input.addEventListener('input', () => {
            block.body = safeFallback(block.input.value); block.bodyChanged = true; changed(record);
        });
        block.input.addEventListener('paste', event => receivePaste(record, block, event));
        block.input.addEventListener('drop', event => receiveImages(record, block, event, 'drop'));
        for (const direction of ['up', 'down']) block[direction].addEventListener('click', () => {
            const index = record.blocks.indexOf(block), next = index + (direction === 'up' ? -1 : 1);
            if (next < 0 || next >= record.blocks.length) return;
            [record.blocks[index], record.blocks[next]] = [record.blocks[next], record.blocks[index]];
            // Moving an iframe can reload its document. Remove/recreate TinyMCE around the move.
            record.blocks.forEach(item => stopEditor(item));
            record.blocks.forEach(item => record.list.append(item.card));
            record.blocks.forEach(item => startEditor(record, item));
            buttons(record); changed(record); block[direction].focus();
        });
        block.remove.addEventListener('click', () => {
            if (record.blocks.length === 1) return;
            if ((block.heading.value.trim() || meaningful(block.body)) && !window.confirm('このセクションを削除しますか？')) return;
            stopEditor(block); owners.delete(block.input.id);
            record.blocks.splice(record.blocks.indexOf(block), 1); card.remove();
            if (record.active === block) record.active = record.blocks.at(-1);
            buttons(record); changed(record); focusBlock(record, record.active || record.blocks[0]);
        });

    }
    function stopEditor(block) {
        // Flush dirty content even when TinyMCE has not emitted change yet.
        block.read?.();

        try { block.pending?.remove(); } catch (_) { /* Native textarea remains usable. */ }

        block.read = null;
        block.card.classList.remove('knowledge-editor-ready');
        block.input.hidden = false; block.input.style.display = ''; block.input.value = block.bodyChanged ? block.body : editableHtml(block.body);
    }
    function receivePaste(record, block, event) {
        const transfer = event.clipboardData || event.originalEvent?.clipboardData;
        if (!transfer) return false;
        const text = transfer.getData?.('text/plain') || '';
        if (!text) return receiveImages(record, block, event, 'paste');

        event.preventDefault();
        event.stopImmediatePropagation?.();

        const content = escape(text.replace(/\r\n?/g, '\n')).replace(/\n/g, '<br>');
        if (block.editor) {
            const insert = () => block.editor.insertContent(content);
            if (block.editor.undoManager) block.editor.undoManager.transact(insert);
            else insert();
            block.body = block.editor.getContent();
            block.editor.setDirty(false);
        } else {
            const input = block.input;
            input.setRangeText(content, input.selectionStart, input.selectionEnd, 'end');
            block.body = safeFallback(input.value);
        }
        block.bodyChanged = true;
        block.input.value = block.body;
        changed(record);
        return true;
    }
    function receiveImages(record, block, event, kind) {
        if (!record.images) return false;
        const transfer = event.dataTransfer || event.clipboardData || event.originalEvent?.dataTransfer || event.originalEvent?.clipboardData;
        if (!transfer) return false;

            ? Array.from(transfer.items || []).filter(item => item.kind === 'file').map(item => item.getAsFile()).filter(Boolean)
            : Array.from(transfer.files || []);

        if (!images.length) return false;
        event.preventDefault();
        record.active = block;
        const now = Date.now();
        const renamed = images.map((file, index) => {
            const extension = (file.type.split('/')[1] || 'png').replace('jpeg', 'jpg').replace(/[^a-z0-9]/gi, '') || 'png';
            return new File([file], (kind === 'paste' ? 'clipboard_' : 'drop_') + now + '_' + (++serial) + '_' + index + '.' + extension, {type: file.type});

        return true;
    }
    function startEditor(record, block) {
        if (!window.tinymce?.init || block.pending || block.ready) return;

        const generation = block.generation = (block.generation || 0) + 1;
        const stale = () => block.expired || block.generation !== generation || !block.card.isConnected;
        const fallback = () => { if (!stale()) stopEditor(block); };

            if (stale() || !block.ready || (!/^(input|undo|redo)$/i.test(event?.type || '') && !editor.isDirty())) return;

                target: block.input, plugins: 'lists', toolbar: 'undo redo | bold italic forecolor | bullist numlist | knowledgecommand',
                paste_as_text: true,
                license_key: 'gpl', indent: false, indent_use_margin: false,
                height: 300, min_height: 160, resize: true, menubar: false, statusbar: true,
                elementpath: false,
                branding: false, promotion: false, browser_spellcheck: true,
                valid_elements: 'p[style|class],br,strong/b,em/i,u,s,strike,del,sub,sup,' +
                    'ul[style|class],ol[start|type|style|class],li[style|class],a[href|title|target|rel],' +
                    'img[src|alt|title|width|height|class|style],h1[style|class],h2[style|class],h3[style|class],' +
                    'h4[style|class],h5[style|class],h6[style|class],div[style|class],span[style|class],' +
                    'blockquote[style|class],pre,code,hr,table,thead,tbody,tfoot,tr,th[colspan|rowspan],td[colspan|rowspan]',
                content_style: 'body{font-family: sans-serif;margin:12px;font-size:10pt;line-height:1.5;} p,h1,h2,h3,h4,h5,h6,div,blockquote{text-indent:0!important;margin-left:0!important;margin-right:0!important;} p,div{padding-left:0!important;} ul,ol{padding-left:1.6em;margin-left:0;text-indent:0;} li{text-indent:0;} .knowledge-command{background:#e8f4ff;border:1px solid #bddcff;border-radius:4px;padding:6px!important;margin-block:4px;white-space:pre-wrap;} .knowledge-command>code{font-family:monospace;white-space:pre-wrap;}',
                setup(editor) {
                    if (stale()) { setTimeout(() => editor.remove(), 0); return; }
                    block.pending = editor;
                    editor.ui?.registry?.addButton('knowledgecommand', {
                        icon: 'paste', tooltip: '選択行をコピー可能なコマンドに指定／解除',
                        onAction: () => toggleCommand(editor)
                    });
                    editor.on('init', () => {
                        if (stale()) { editor.remove(); return; }
                        clearTimeout(block.timer);
                        // Typing in the native textarea while initialization is pending wins.
                        editor.setContent(block.bodyChanged ? block.body : editableHtml(block.body)); editor.setDirty(false);
                        block.editor = editor; block.ready = true;
                        block.read = () => read(editor);
                        block.card.classList.add('knowledge-editor-ready');
                        block.input.hidden = true;
                    });
                    editor.on('input change Undo Redo', event => read(editor, event));
                    editor.on('init input change SetContent Undo Redo focus blur', () => state(record, Boolean(editor.hasFocus?.())));
                    editor.on('paste', event => receivePaste(record, block, event));
                    editor.on('drop', event => receiveImages(record, block, event, 'drop'));
                    editor.on('focus', () => { record.active = block; state(record, true); });
                    editor.on('blur', () => {
                        try { block.bookmark = editor.selection.getBookmark(2, true); } catch (_) { block.bookmark = null; }
                        state(record, false);
                    });
                    editor.on('keyup mouseup NodeChange', () => {
                        if (!block.ready) return;
                        try { block.bookmark = editor.selection.getBookmark(2, true); } catch (_) { /* Selection may be absent. */ }
                    });
                }
            });
            Promise.resolve(promise).then(editors => {
                if (stale()) (editors || []).forEach(editor => { try { editor.remove(); } catch (_) {} });
            }, fallback);
        } catch (_) { fallback(); }
    }
    function initialize(source) {
        if (!source.id || records.has(source.id)) return;
        const root = document.createElement('div'); root.className = 'knowledge-block-editor';
        root.dataset.knowledgeEditor = source.id;
        const list = document.createElement('div'); list.style.display = 'contents'; root.append(list);
        const addButton = document.createElement('button'); addButton.type = 'button'; addButton.textContent = 'セクションを追加'; root.append(addButton);
        source.after(root);
        const record = {source, root, list, blocks: [], active: null, changed: false, original: source.value};
        records.set(source.id, record);
        try {
            parse(source.value).forEach(data => add(record, data));
            addButton.addEventListener('click', () => { const block = add(record); changed(record); block.heading.focus(); });
            // Retain original id/name for server submission and external consumers.
            source.hidden = true;
            source.dataset.knowledgeBlockEditor = 'true';
            // Native required validation cannot focus a hidden source. Integration uses hasContent().
            source.required = false;
        } catch (_) {
            record.blocks.forEach(block => { stopEditor(block); owners.delete(block.input.id); });
            records.delete(source.id); root.remove();
        }
    }
    window.KnowledgeBlockEditors = Object.freeze({
        getHtml(id) { return records.has(id) ? sync(records.get(id)) : document.getElementById(id)?.value || ''; },
        sync(id) { return records.has(id) ? sync(records.get(id)) : document.getElementById(id)?.value || ''; },
        syncForm(form) { records.forEach(record => { if (record.source.form === form) sync(record); }); },
        configureImages(id, callback) { const record = records.get(id); if (record) record.images = callback; },
        upgrade() { records.forEach(record => record.blocks.forEach(block => { if (!block.expired) startEditor(record, block); })); },
        validate(form) {
            for (const record of records.values()) {
                if (record.source.form !== form) continue;
                sync(record);
                const missingHeading = record.blocks.find(block => !headingText(block.heading.value));
                const hasBody = window.KnowledgeBlockEditors.hasContent(record.source.id);
                if (!missingHeading && hasBody) continue;
                if (!record.error) {
                    record.error = document.createElement('p'); record.error.className = 'knowledge-block-error';
                    record.error.setAttribute('role', 'alert');
                    record.root.append(record.error);
                }
                record.error.textContent = missingHeading ? '見出しを入力してください。' : '本文を入力してください。見出しのみでは登録できません。';
                record.error.hidden = false;
                record.error.id ||= record.source.id + '-block-error';
                if (missingHeading) {
                    missingHeading.heading.setAttribute('aria-invalid', 'true');
                    missingHeading.heading.setAttribute('aria-describedby', record.error.id);
                    state(record, true);
                    missingHeading.heading.focus();
                    return false;
                }
                record.blocks[0].input.setAttribute('aria-describedby', record.blocks[0].input.id + '-hint ' + record.error.id);
                state(record, true);
                focusBlock(record, record.blocks[0]);
                return false;
            }
            return true;
        },
        hasContent(id) {
            const record = records.get(id);
            if (record) sync(record);
            return record ? record.blocks.some(block => meaningful(block.body)) : meaningful(document.getElementById(id)?.value || '');
        },
        insertMarker(id, marker) {
            const record = records.get(id); if (!record) return false;
            const block = record.active || record.blocks.at(-1);
            if (block.editor) {
                block.editor.focus();
                if (block.bookmark) { try { block.editor.selection.moveToBookmark(block.bookmark); } catch (_) {} }
                block.editor.insertContent(escape(marker));
                block.body = block.editor.getContent(); block.editor.setDirty(false);
            } else {
                const input = block.input, start = input.selectionStart ?? input.value.length, end = input.selectionEnd ?? start;
                const position = record.active ? start : input.value.length;
                input.setRangeText(escape(marker), position, record.active ? end : position, 'end');
                block.body = safeFallback(input.value); input.focus();
            }
            block.bodyChanged = true; block.input.value = block.body; changed(record); return true;
        },
        focus(id) { const record = records.get(id); if (!record) return false; focusBlock(record, record.active || record.blocks[0]); return true; },
        ownerId(editorOrId) { return owners.get(typeof editorOrId === 'string' ? editorOrId : editorOrId?.id) || null; }
    });
    // Register immediately, before inline form submit handlers. triggerSave only touches nameless internals.
    document.addEventListener('submit', event => window.KnowledgeBlockEditors.syncForm(event.target), true);
    const init = () => document.querySelectorAll('textarea[data-wysiwyg="true"]').forEach(initialize);
    init();
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, {once: true});
})();
</script>
