<div class="modal fade" id="knowledgeDuplicateModal" tabindex="-1" aria-labelledby="knowledgeDuplicateTitle" aria-hidden="true"
     data-candidates-url="{% url 'knowledge_duplicate_candidates' %}">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="knowledgeDuplicateTitle"><i class="bi bi-search me-2" aria-hidden="true"></i>同じ記事がないですか？</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-info mb-3">
                    <span id="knowledgeDuplicateInstructions">選択したカテゴリの既存ナレッジを確認してください。同じ内容の記事がなければ、プレビューへ進んでください。</span>
                    <div class="small mt-1">カテゴリのいずれかが一致する、一覧で閲覧可能なQ&amp;A・Tipsを更新順に表示します。詳細は別タブで開きます。</div>
                </div>
                <div id="knowledgeDuplicateCategories" class="d-flex flex-wrap gap-2 mb-3"></div>
                <p id="knowledgeDuplicateStatus" class="small text-muted" role="status" aria-live="polite"></p>
                <div id="knowledgeDuplicateResults" class="list-group mb-3"></div>
                <div class="d-flex align-items-center justify-content-between gap-2">
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="knowledgeDuplicatePrevious" disabled>前へ</button>
                    <span id="knowledgeDuplicatePage" class="small text-muted"></span>
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="knowledgeDuplicateNext" disabled>次へ</button>
                </div>
                <button type="button" class="btn btn-outline-secondary btn-sm mt-3" id="knowledgeDuplicateRetry" hidden>再読み込み</button>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">入力に戻る</button>
                <button type="button" class="btn btn-primary" id="knowledgeDuplicateContinue" disabled>重複がないことを確認してプレビューへ</button>
            </div>
        </div>
    </div>
</div>
