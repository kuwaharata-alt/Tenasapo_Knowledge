{% extends "base.html" %}

{% block title %}パスワード再設定 | Nexus{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-3">パスワードの再発行について</h1>
                <p class="mb-2">パスワードの再発行をご希望のお客様は、お手数ですがテナサポ問い合わせ窓口までご連絡ください。</p>
                <p class="mb-0">ご連絡を確認後、パスワード再発行専用URLをメールにてお送りいたします。</p>
                <div class="mt-3 text-center">
                    <a href="{% url 'login' %}" class="small text-decoration-none">ログイン画面に戻る</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
