<button type="button" class="btn btn-outline-secondary summary-detail-info" popovertarget="detail-help-{{ detail_key }}-{{ kind }}" aria-label="{{ title }}の説明"><i class="bi bi-info-lg" aria-hidden="true"></i></button>
<div popover="auto" id="detail-help-{{ detail_key }}-{{ kind }}" class="summary-detail-help">
    <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
        <strong>{{ title }}</strong>
        <button type="button" class="btn-close" popovertarget="detail-help-{{ detail_key }}-{{ kind }}" popovertargetaction="hide" aria-label="説明を閉じる"></button>
    </div>
    <p class="summary-detail-note mb-0">{{ explanation }}</p>
</div>
